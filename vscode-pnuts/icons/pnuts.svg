    <!-- Sleek modern highlight sheen (top lobe) -->
    <ellipse cx="14" cy="8" rx="3.5" ry="1.8" transform="rotate(-15 14 8)" fill="#FFFFFF" opacity="0.32"/>
    <!-- Sleek modern highlight sheen (bottom lobe) -->
