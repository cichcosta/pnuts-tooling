<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g transform="rotate(-15 64 64)">
    <!-- Peanut Pod Shell: Catppuccin Peach #f5a97f with dark Macchiato outline #24273a -->
    <path d="M 64 12
             C 86 12, 98 28, 95 48
             C 93 59, 84 64, 84 68
             C 84 72, 96 79, 99 92
             C 103 112, 86 122, 64 122
             C 42 122, 25 112, 29 92
             C 32 79, 44 72, 44 68
             C 44 64, 35 59, 33 48
             C 30 28, 42 12, 64 12 Z"
          fill="#f5a97f"
          stroke="#24273a"
          stroke-width="4.5"
          stroke-linejoin="round"/>

    <!-- Peanut Shell Texture: Catppuccin Yellow #eed49f ribs -->
    <g stroke="#eed49f" stroke-width="3.2" stroke-linecap="round" fill="none">
      <!-- Upper lobe curves -->
      <path d="M 48 28 Q 64 36 80 28"/>
      <path d="M 40 45 Q 64 54 88 45"/>
      <!-- Upper lobe ribs -->
      <path d="M 52 20 Q 47 40 46 59"/>
      <path d="M 64 15 Q 64 40 64 61"/>
      <path d="M 76 20 Q 81 40 82 59"/>

      <!-- Lower lobe curves -->
      <path d="M 38 82 Q 64 93 90 82"/>
      <path d="M 40 98 Q 64 109 88 98"/>
      <!-- Lower lobe ribs -->
      <path d="M 45 74 Q 40 96 46 113"/>
      <path d="M 64 72 Q 64 96 64 119"/>
      <path d="M 83 74 Q 88 96 82 113"/>
    </g>

    <!-- Waist pinch ring: Catppuccin Crust #181926 -->
    <path d="M 44 68 Q 64 75 84 68"
          stroke="#181926"
          stroke-width="4"
          stroke-linecap="round"
          fill="none"/>

    <!-- Highlights: Catppuccin Rosewater #f4dbd6 -->
    <ellipse cx="62" cy="22" rx="10" ry="4" fill="#f4dbd6" opacity="0.55"/>
    <ellipse cx="60" cy="80" rx="11" ry="4.5" fill="#f4dbd6" opacity="0.4"/>
  </g>
</svg>
