<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background glow for dark theme visibility -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="peanutBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFD685"/>
      <stop offset="35%" stop-color="#F5B247"/>
      <stop offset="70%" stop-color="#DD8622"/>
      <stop offset="100%" stop-color="#B8620E"/>
    </linearGradient>
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFB347" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7A3906" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-15 64 64)" filter="url(#softGlow)">
    <!-- Peanut Main Pod Outer Shape -->
    <!-- Two lobes with narrowed waist -->
    <path d="M 64 12
             C 86 12, 98 28, 95 48
             C 93 59, 84 64, 84 68
             C 84 72, 96 79, 99 92
             C 103 112, 86 122, 64 122
             C 42 122, 25 112, 29 92
             C 32 79, 44 72, 44 68
             C 44 64, 35 59, 33 48
             C 30 28, 42 12, 64 12 Z"
          fill="url(#peanutBody)"
          stroke="#5C2E0B"
          stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Inner highlight shading -->
    <path d="M 64 12
             C 86 12, 98 28, 95 48
             C 93 59, 84 64, 84 68
             C 84 72, 96 79, 99 92
             C 103 112, 86 122, 64 122
             C 42 122, 25 112, 29 92
             C 32 79, 44 72, 44 68
             C 44 64, 35 59, 33 48
             C 30 28, 42 12, 64 12 Z"
          fill="url(#innerShadow)"/>

    <!-- Peanut Shell Texture / Mesh Grid Lines -->
    <g stroke="#803D06" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.6">
      <!-- Upper lobe horizontal curves -->
      <path d="M 48 27 Q 64 34 80 27"/>
      <path d="M 40 43 Q 64 52 88 43"/>
      <path d="M 42 57 Q 64 65 86 57"/>

      <!-- Upper lobe vertical ribs -->
      <path d="M 52 18 Q 47 38 46 59"/>
      <path d="M 64 13 Q 64 38 64 61"/>
      <path d="M 76 18 Q 81 38 82 59"/>

      <!-- Waist pinch ring -->
      <path d="M 45 68 Q 64 74 83 68" stroke-width="3.2" stroke="#682F04" opacity="0.75"/>

      <!-- Lower lobe horizontal curves -->
      <path d="M 37 81 Q 64 92 91 81"/>
      <path d="M 39 97 Q 64 108 89 97"/>
      <path d="M 48 111 Q 64 118 80 111"/>

      <!-- Lower lobe vertical ribs -->
      <path d="M 44 74 Q 39 96 46 114"/>
      <path d="M 64 72 Q 64 96 64 120"/>
      <path d="M 84 74 Q 89 96 82 114"/>
    </g>

    <!-- Top Highlight Sheen -->
    <ellipse cx="62" cy="24" rx="14" ry="7" fill="#FFFFFF" opacity="0.32"/>
    <ellipse cx="60" cy="80" rx="12" ry="5.5" fill="#FFFFFF" opacity="0.22"/>
  </g>
</svg>
